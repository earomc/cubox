<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="cubox, a super fast Minecraft seed viewer">
    <title>cubox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #181818; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      /* see below */
      #typing { position: fixed; inset: 0 0 auto 0; display: none; gap: 8px; padding: 8px; background: #2a2a2a; }
      #typing.open { display: flex; }
      /* 16px, otherwise iPhones zoom the page when it gets focus */
      #keyboard { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 1px solid #666; border-radius: 4px; background: #111; color: #eee; }
      #done { font-size: 16px; padding: 8px 16px; border: 0; border-radius: 4px; background: #2a6f97; color: #fff; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #ccc; font: 16px system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="cubox" tabindex="0"></canvas>
    <form id="typing">
      <input id="keyboard" type="text" placeholder="Type new value" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="done" type="submit">Done</button>
    </form>
    <div id="status">Loading cubox…</div>
    <script type="module">
      import init, { start, typed, typed_enter } from "./pkg/cubox.js";

      // A canvas can't open a phone's keyboard, only a real text field can. So on touch screens a
      // bar with one shows up while cubox wants text, and what is typed there replaces the text of
      // the field in cubox. Android opens the keyboard right away. iPhones and iPads only open it
      // during a tap, there the tap goes on this bar. With a real keyboard and no touch screen the
      // canvas gets the keys directly and this stays hidden.
      const typing = document.getElementById("typing");
      const keyboard = document.getElementById("keyboard");
      const canvas = document.getElementById("cubox");
      const touch = navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
      globalThis.cuboxKeyboard = (wanted) => {
        if (!touch) return;
        typing.classList.toggle("open", wanted);
        if (wanted) {
          keyboard.value = "";
          keyboard.focus();
        } else {
          keyboard.blur();
          canvas.focus();
        }
      };
      keyboard.addEventListener("input", () => typed(keyboard.value));
      typing.addEventListener("submit", (event) => {
        event.preventDefault();
        typed_enter();
      });
      const status = document.getElementById("status");
      try {
        await init();
        start("cubox");
        status.remove();
      } catch (error) {
        status.textContent = "cubox couldn't start: " + error;
        throw error;
      }
    </script>
  </body>
</html>
