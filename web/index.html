<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="cubox, a super fast Minecraft seed viewer">
    <title>cubox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #181818; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      /* see below. 16px, otherwise iPhones zoom the page when it gets focus */
      #keyboard { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #ccc; font: 16px system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="cubox" tabindex="0"></canvas>
    <input id="keyboard" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">
    <div id="status">Loading cubox…</div>
    <script type="module">
      import init, { start, typed } from "./pkg/cubox.js";

      // A canvas can't open a phone's keyboard, only a real text field can. So one is hidden on the
      // page, it gets the focus while cubox wants text and passes on what is typed. With a real
      // keyboard the canvas gets the keys directly and this stays out of the way.
      const keyboard = document.getElementById("keyboard");
      const touch = matchMedia("(pointer: coarse)").matches;
      let open = false;
      globalThis.cuboxKeyboard = (wanted) => {
        open = wanted;
        if (!touch) return;
        if (wanted) keyboard.focus();
        else keyboard.blur();
      };
      // iPhones only open it during a touch: if that didn't work above, the next tap does
      document.addEventListener("touchend", () => { if (touch && open) keyboard.focus(); });
      keyboard.addEventListener("beforeinput", (event) => {
        event.preventDefault();
        if (event.inputType.startsWith("delete")) typed(null, "Backspace");
        else if (event.data) typed(event.data, null);
      });
      keyboard.addEventListener("keydown", (event) => {
        if (event.key === "Enter") typed(null, "Enter");
      });
      const status = document.getElementById("status");
      try {
        await init();
        start("cubox");
        status.remove();
      } catch (error) {
        status.textContent = "cubox couldn't start: " + error;
        throw error;
      }
    </script>
  </body>
</html>
