<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="cubox, a super fast Minecraft seed viewer">
    <title>cubox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #181818; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #ccc; font: 16px system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="cubox" tabindex="0"></canvas>
    <div id="status">Loading cubox…</div>
    <script type="module">
      import init, { start } from "./pkg/cubox.js";
      const status = document.getElementById("status");
      try {
        await init();
        start("cubox");
        status.remove();
      } catch (error) {
        status.textContent = "cubox couldn't start: " + error;
        throw error;
      }
    </script>
  </body>
</html>
